<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زواج</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-white text-slate-800 m-0 p-0">

    <!-- الصفحة الأولى: بيضاء بالكامل وبها نموذج الإدخال فقط -->
    <div id="generator-screen" class="min-h-screen flex items-center justify-center p-4 bg-white">
        <div class="w-full max-w-md p-6 bg-white rounded-xl shadow-md border border-gray-100">
            <h1 class="text-xl font-bold text-center mb-6 text-gray-900">تخصيص دعوة الزواج</h1>
            
            <form id="invite-form" class="space-y-4">
                <div>
                    <label class="block text-sm mb-1 font-semibold text-gray-700">اسم العريس:</label>
                    <input type="text" id="groom_name" required class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-black">
                </div>
                
                <div>
                    <label class="block text-sm mb-1 font-semibold text-gray-700">اسم العروس:</label>
                    <input type="text" id="bride_name" required class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-black">
                </div>
                
                <div>
                    <label class="block text-sm mb-1 font-semibold text-gray-700">التاريخ:</label>
                    <input type="text" id="wedding_date" required class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-black">
                </div>

                <div>
                    <label class="block text-sm mb-1 font-semibold text-gray-700">اسم الموقع (القاعة):</label>
                    <input type="text" id="location_name" required class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-black">
                </div>

                <div>
                    <label class="block text-sm mb-1 font-semibold text-gray-700">رابط الموقع:</label>
                    <input type="url" id="location_url" required class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-black">
                </div>

                <button type="submit" class="w-full bg-black text-white font-bold py-3 rounded-lg hover:bg-gray-800 transition duration-200 mt-2">
                    اصنع الدعوة
                </button>
            </form>
        </div>
    </div>

    <!-- الصفحة الثانية: نفس تصميمك الأصلي تماماً (تظهر بعد الضغط على اصنع الدعوة) -->
    <div id="invitation-screen" class="hidden min-h-screen flex flex-col items-center justify-between p-6 text-center">
        <div class="w-full max-w-md space-y-6 my-auto">
            <h2 class="text-2xl font-bold">حفل زفاف مبارك</h2>
            
            <div class="text-xl font-semibold">
                <span id="view-groom"></span> & <span id="view-bride"></span>
            </div>
            
            <!-- فيديو الدعوة بروابط جيت هاب المباشرة -->
            <div class="rounded-xl overflow-hidden shadow">
                <video controls class="w-full" poster="https://raw.githubusercontent.com/alhasanyk/V0-customized-interactive-invitation-files/refs/heads/main/IMG_0048.jpeg">
                    <source src="https://raw.githubusercontent.com/alhasanyk/V0-customized-interactive-invitation-files/refs/heads/main/2026-09-21%2017%3A15%3A00.mov" type="video/quicktime">
                    متصفحك لا يدعم عرض الفيديو
                </video>
            </div>

            <p id="view-date" class="font-medium"></p>
            <p id="view-location" class="text-gray-600"></p>

            <a id="view-map-btn" href="#" target="_blank" class="inline-block bg-slate-900 text-white px-6 py-2.5 rounded-lg text-sm font-medium">
                فتح الموقع على الخريطة
            </a>
        </div>
    </div>

    <script>
        document.getElementById('invite-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // سحب البيانات المدخلة
            const groom = document.getElementById('groom_name').value;
            const bride = document.getElementById('bride_name').value;
            const date = document.getElementById('wedding_date').value;
            const locName = document.getElementById('location_name').value;
            const locUrl = document.getElementById('location_url').value;

            // حقن البيانات في صفحة الدعوة الأصلية
            document.getElementById('view-groom').innerText = groom;
            document.getElementById('view-bride').innerText = bride;
            document.getElementById('view-date').innerText = date;
            document.getElementById('view-location').innerText = locName;
            document.getElementById('view-map-btn').href = locUrl;

            // إخفاء الصفحة البيضاء وإظهار صفحة الدعوة
            document.getElementById('generator-screen').classList.add('hidden');
            document.getElementById('invitation-screen').classList.remove('hidden');
        });
    </script>
</body>
</html>
