<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Wedding Invitation - Generator</title>
    
    <!-- الخطوط الأنيقة -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Pinyon+Script&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #f7f4ef;
            overflow: hidden;
            font-family: 'Cinzel', serif;
        }

        /* صفحة توليد الدعوة باللغة الإنجليزية */
        #generator-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            z-index: 99999;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Cairo', sans-serif;
            direction: ltr;
            text-align: left;
            opacity: 1;
            transition: opacity 1s ease-in-out;
        }

        #generator-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .screen-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.2s ease-in-out;
            background-color: #f7f4ef;
        }

        .screen-page.active {
            opacity: 1;
            pointer-events: auto;
        }

        video, img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        #video-page {
            background-color: #f7f4ef;
        }
        
        #bg-image {
            z-index: 1;
        }

        #myVideo {
            z-index: 2;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        /* زر الختم */
        #playBtn {
            position: absolute;
            top: 52.5%; 
            left: 50.2%; 
            transform: translate(-50%, -50%);
            z-index: 9999;
            width: 105px;  
            height: 105px;
            background: transparent;
            border: 2px solid rgba(245, 235, 220, 0.75);
            color: #fcf8f2;
            font-size: 32px; 
            font-family: 'Great Vibes', cursive;
            letter-spacing: 1px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: opacity 0.8s ease, transform 0.4s ease, background 0.3s;
        }

        #playBtn.fade-in {
            opacity: 1;
        }

        #playBtn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        #playBtn:active {
            transform: translate(-50%, -50%) scale(0.95);
        }

        /* شاشة الأسماء المتحركة بالفيديو الثاني */
        #couple-names {
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 20px;
            width: 100%;
        }

        .name-top, .name-bottom, .name-and {
            font-family: 'Pinyon Script', cursive;
            color: #3b2a22;
            white-space: nowrap;
            clip-path: inset(0 100% 0 0);
            transition: clip-path 2s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease, transform 0.8s ease, filter 0.8s ease;
        }

        .name-top {
            font-size: 2.8rem;
            line-height: 1.1;
        }

        .name-and {
            font-size: 2rem;
            color: #7a6558;
            margin: 6px auto;
            letter-spacing: 2px;
        }

        .name-bottom {
            font-size: 2.8rem;
            line-height: 1.1;
        }

        .name-top.writing, .name-and.writing, .name-bottom.writing {
            clip-path: inset(0 0% 0 0);
        }

        .name-top.hide, .name-and.hide, .name-bottom.hide {
            opacity: 0;
            transform: scale(0.9);
            filter: blur(8px);
            transition: all 0.8s ease;
        }

        /* الشاشة الأخيرة - مطابقة تماماً للصورة الأخيرة */
        #final-page {
            position: fixed;
        }

        .final-content-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 33vh;
            text-align: center;
            transform: translateX(-6px);
        }

        .final-bride-name {
            font-family: 'Pinyon Script', cursive;
            font-size: 2rem;
            color: #3b2a22;
            line-height: 1;
        }

        .final-middle-and {
            font-family: 'Pinyon Script', cursive;
            font-size: 1.2rem;
            color: #7a6558;
            margin: 1px 0;
        }

        .final-groom-name {
            font-family: 'Pinyon Script', cursive;
            font-size: 2rem;
            color: #3b2a22;
            line-height: 1;
            margin-bottom: 2.5rem;
        }

        .date-time-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2.2rem;
            width: 85%;
            max-width: 380px;
        }

        .dt-box {
            font-family: 'Cinzel', serif;
            font-size: 0.65rem;
            font-weight: 600;
            color: #3b2a22;
            letter-spacing: 0.5px;
            width: 100px;
            text-align: center;
            white-space: nowrap;
        }

        .date-center-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 60px;
        }

        .date-center-box .day-num {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: #3b2a22;
            line-height: 1;
        }

        .date-center-box .m-y-text {
            font-family: 'Cinzel', serif;
            font-size: 0.55rem;
            font-weight: 600;
            color: #3b2a22;
            letter-spacing: 0.5px;
            line-height: 1.2;
            margin-top: 2px;
            text-align: center;
        }

        .location-name-display {
            font-family: 'Pinyon Script', cursive;
            font-size: 1.7rem;
            color: #3b2a22;
            line-height: 1;
            margin-top: 0.6rem;
        }

        .action-group {
            position: absolute;
            bottom: calc(30px + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .location-btn, .calendar-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #332211;
            text-decoration: none;
            font-family: 'Cinzel', serif;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            padding: 6px 16px;
            border-radius: 20px;
            background: rgba(247, 244, 239, 0.92);
            border: 1px solid rgba(51, 34, 17, 0.3);
            backdrop-filter: blur(2px);
            transition: all 0.3s ease;
            cursor: pointer;
            width: 250px;
        }

        .location-btn svg, .calendar-btn svg {
            width: 11px;
            height: 11px;
            fill: #332211;
        }
    </style>
</head>
<body>

    <!-- صفحة إدخال البيانات باللغة الإنجليزية -->
    <div id="generator-screen">
        <div class="w-full max-w-md p-6 bg-white rounded-2xl shadow-xl border border-gray-100">
            <h1 class="text-xl font-bold text-center mb-6 text-gray-900">Customize Invitation Details</h1>
            
            <form id="invite-form" class="space-y-4">
                <div>
                    <label class="block text-sm mb-1 font-semibold text-gray-700">Groom's Name:</label>
                    <input type="text" id="groom_name_input" placeholder="e.g. Hasan" required class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-black">
                </div>
                
                <div>
                    <label class="block text-sm mb-1 font-semibold text-gray-700">Bride's Name:</label>
                    <input type="text" id="bride_name_input" placeholder="e.g. Midi" required class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-black">
                </div>
                
                <div>
                    <label class="block text-sm mb-1 font-semibold text-gray-700">Wedding Date & Time:</label>
                    <input type="datetime-local" id="wedding_date_input" required class="w-full bg-transparent border border-gray-300 rounded-lg p-2 text-sm focus:outline-none focus:border-black">
                </div>

                <div>
                    <label class="block text-sm mb-1 font-semibold text-gray-700">Location / Venue Name:</label>
                    <input type="text" id="location_name_input" placeholder="e.g. Jeddah" required class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-black">
                </div>

                <div>
                    <label class="block text-sm mb-1 font-semibold text-gray-700">Google Maps URL:</label>
                    <input type="url" id="location_url_input" placeholder="https://maps.app.goo.gl/..." required class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-black">
                </div>

                <button type="submit" class="w-full bg-black text-white font-bold py-3 rounded-lg hover:bg-gray-800 transition duration-200 mt-4">
                    Create Invitation
                </button>
            </form>
        </div>
    </div>

    <!-- 1. شاشة الفيديو الأولى -->
    <div id="video-page" class="screen-page active">
        <img id="bg-image" src="https://raw.githubusercontent.com/alhasanyk/V0-customized-interactive-invitation-files/refs/heads/main/IMG_0048.jpeg" alt="Background">
        <button id="playBtn">press</button>
        <video id="myVideo" src="https://raw.githubusercontent.com/alhasanyk/V0-customized-interactive-invitation-files/refs/heads/main/2026-09-21%2017%3A15%3A00.mov" playsinline webkit-playsinline preload="auto"></video>
    </div>

    <!-- 2. شاشة الأسماء المتحركة -->
    <div id="names-page" class="screen-page">
        <img src="https://raw.githubusercontent.com/alhasanyk/V0-customized-interactive-invitation-files/refs/heads/main/IMG_0042.jpeg" alt="Background">
        <div id="couple-names">
            <div class="name-top" id="n1"></div>
            <div class="name-and" id="n2">and</div>
            <div class="name-bottom" id="n3"></div>
        </div>
    </div>

    <!-- 3. الشاشة الأخيرة -->
    <div id="final-page" class="screen-page">
        <img src="https://raw.githubusercontent.com/alhasanyk/V0-customized-interactive-invitation-files/refs/heads/main/FFF1FC39-7F20-41E0-B2BC-4A55FB5D634E.png" alt="Final Image">

        <div class="final-content-container">
            <div class="final-bride-name" id="disp-bride">Midi</div>
            <div class="final-middle-and">and</div>
            <div class="final-groom-name" id="disp-groom">Hasan</div>

            <div class="date-time-section">
                <div class="dt-box" id="disp-time">PM 02:32</div>
                <div class="date-center-box">
                    <span class="day-num" id="disp-daynum">22</span>
                    <span class="m-y-text" id="disp-monthyear">SEP<br>2026</span>
                </div>
                <div class="dt-box" id="disp-day">TUESDAY</div>
            </div>

            <div class="location-name-display" id="disp-locname">Jeddah</div>
        </div>

        <div class="action-group">
            <a id="final-map-btn" href="#" target="_blank" class="location-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                </svg>
                📍 LOCATION 📍
            </a>

            <button class="calendar-btn" onclick="addToCalendar()">
                <svg viewBox="0 0 24 24">
                    <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zm-7 5h5v5h-5z"/>
                </svg>
                📅 ADD TO CALENDAR 📅
            </button>
        </div>
    </div>

    <!-- الصوت -->
    <audio id="myAudio" src="https://raw.githubusercontent.com/alhasanyk/V0-customized-interactive-invitation-files/refs/heads/main/Zafah.mp3" preload="auto"></audio>

    <script>
        let eventDateGlobal = new Date().getTime();
        let locationNameText = "";

        document.getElementById('invite-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const groomVal = document.getElementById('groom_name_input').value;
            const brideVal = document.getElementById('bride_name_input').value;
            const dateVal = document.getElementById('wedding_date_input').value;
            const locNameVal = document.getElementById('location_name_input').value;
            const locUrlVal = document.getElementById('location_url_input').value;

            document.getElementById('n1').innerText = brideVal;
            document.getElementById('n3').innerText = groomVal;

            document.getElementById('disp-bride').innerText = brideVal;
            document.getElementById('disp-groom').innerText = groomVal;
            document.getElementById('disp-locname').innerText = locNameVal;

            if (dateVal) {
                const dObj = new Date(dateVal);
                eventDateGlobal = dObj.getTime();

                const daysArr = ["SUNDAY", "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY"];
                const monthsArr = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];

                const dayName = daysArr[dObj.getDay()];
                const dayNum = String(dObj.getDate()).padStart(2, '0');
                const monthName = monthsArr[dObj.getMonth()];
                const yearNum = dObj.getFullYear();

                let hours = dObj.getHours();
                const minutes = String(dObj.getMinutes()).padStart(2, '0');
                const ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12;
                hours = hours ? hours : 12;
                const hoursStr = String(hours).padStart(2, '0');
                const timeStr = `${ampm} ${hoursStr}:${minutes}`;

                document.getElementById('disp-day').innerText = dayName;
                document.getElementById('disp-daynum').innerText = dayNum;
                document.getElementById('disp-monthyear').innerHTML = `${monthName}<br>${yearNum}`;
                document.getElementById('disp-time').innerText = timeStr;
            }

            document.getElementById('final-map-btn').href = locUrlVal;
            locationNameText = locNameVal;

            const genScreen = document.getElementById('generator-screen');
            genScreen.classList.add('fade-out');
            setTimeout(() => {
                genScreen.style.display = 'none';
                setTimeout(() => {
                    document.getElementById('playBtn').classList.add('fade-in');
                }, 500);
            }, 1000);
        });

        function addToCalendar() {
            const title = "Wedding Celebration";
            const description = "We are honored to have you join our special day!";
            
            const dObj = new Date(eventDateGlobal);
            const startTime = dObj.toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
            const endDateObj = new Date(eventDateGlobal + 3 * 3600 * 1000);
            const endTime = endDateObj.toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";

            const icsLines = [
                "BEGIN:VCALENDAR",
                "VERSION:2.0",
                "PRODID:-//Wedding Invitation//EN",
                "BEGIN:VEVENT",
                "UID:" + Date.now() + "@wedding.invitation",
                "DTSTAMP:" + new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z",
                "DTSTART:" + startTime,
                "DTEND:" + endTime,
                "SUMMARY:" + title,
                "DESCRIPTION:" + description,
                "LOCATION:" + locationNameText,
                "END:VEVENT",
                "END:VCALENDAR"
            ];

            const icsBlob = new Blob([icsLines.join("\r\n")], { type: "text/calendar;charset=utf-8" });
            const downloadUrl = URL.createObjectURL(icsBlob);
            
            const anchor = document.createElement("a");
            anchor.href = downloadUrl;
            anchor.setAttribute("download", "wedding-invitation.ics");
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
            URL.revokeObjectURL(downloadUrl);
        }

        const video = document.getElementById('myVideo');
        const audio = document.getElementById('myAudio');
        const playBtn = document.getElementById('playBtn');
        const videoPage = document.getElementById('video-page');
        const namesPage = document.getElementById('names-page');
        const finalPage = document.getElementById('final-page');

        playBtn.addEventListener('click', () => {
            playBtn.style.opacity = '0';
            setTimeout(() => playBtn.style.display = 'none', 300);

            video.currentTime = 5;
            video.style.opacity = '1';

            video.play().then(() => {
                // بدأ التشغيل بنجاح
            }).catch(error => {
                console.log("Autoplay prevented, retrying...", error);
                playBtn.style.display = 'flex';
                playBtn.style.opacity = '1';
            });
        });

        video.addEventListener('ended', () => {
            audio.play().catch(error => {
                console.log("Audio play error:", error);
            });

            namesPage.classList.add('active');
            setTimeout(() => {
                videoPage.classList.remove('active');
            }, 600);

            setTimeout(() => document.getElementById('n1').classList.add('writing'), 400);
            setTimeout(() => document.getElementById('n2').classList.add('writing'), 2200);
            setTimeout(() => document.getElementById('n3').classList.add('writing'), 3200);

            setTimeout(() => {
                document.getElementById('n1').classList.add('hide');
                document.getElementById('n2').classList.add('hide');
                document.getElementById('n3').classList.add('hide');
            }, 6500);

            setTimeout(() => {
                finalPage.classList.add('active');
                setTimeout(() => {
                    namesPage.classList.remove('active');
                }, 600);
            }, 7500);
        });
    </script>
</body>
</html>
