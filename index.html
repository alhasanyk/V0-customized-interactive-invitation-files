<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>دعوة زواج - صانع الدعوات</title>
    
    <!-- خطوط الأنيقة -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Pinyon+Script&display=swap" rel="stylesheet">
    <!-- خط كاييرو للصفحة الأولى -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #f7f4ef;
            overflow: hidden;
            font-family: 'Cinzel', serif;
        }

        /* تنسيق الصفحة الأولى البيضاء الخاصة بالمولد */
        #generator-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            z-index: 99999;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Cairo', sans-serif;
            direction: rtl;
        }

        #generator-screen.hidden {
            display: none;
        }

        /* نظام الشاشات المتداخلة بسلاسة وبدون أي فواصل */
        .screen-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.2s ease-in-out;
            background-color: #f7f4ef;
        }

        .screen-page.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* تنسيق عام للصور والفيديو ليملأ الشاشة بالكامل بدون خطوط سوداء */
        video, img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* شاشة الفيديو الأولى */
        #video-page {
            background-color: #f7f4ef;
        }
        
        #bg-image {
            z-index: 1;
        }

        #myVideo {
            z-index: 2;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        /* زر الختم الدائري */
        #playBtn {
            position: absolute;
            top: 53.5%; 
            left: 50.2%; 
            transform: translate(-50%, -50%);
            z-index: 9999;
            width: 105px;  
            height: 105px;
            background: transparent;
            border: 2px solid rgba(245, 235, 220, 0.75);
            color: #fcf8f2;
            font-size: 32px; 
            font-family: 'Great Vibes', cursive;
            letter-spacing: 1px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: opacity 1s ease, transform 0.3s ease, background 0.3s;
        }

        #playBtn.fade-in {
            opacity: 1;
        }

        #playBtn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        #playBtn:active {
            transform: translate(-50%, -50%) scale(0.95);
        }

        /* شاشة الأسماء (IMG_0042.jpeg) */
        #couple-names {
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 20px;
            width: 100%;
        }

        /* تأثير كتابة خط اليد السلس من اليسار لليمين */
        .name-top, .name-bottom, .name-and {
            font-family: 'Pinyon Script', cursive;
            color: #3b2a22;
            white-space: nowrap;
            clip-path: inset(0 100% 0 0);
            transition: clip-path 2s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease, transform 0.8s ease, filter 0.8s ease;
        }

        .name-top {
            font-size: 2.8rem;
            line-height: 1.1;
        }

        .name-and {
            font-size: 2rem;
            color: #7a6558;
            margin: 6px auto;
            letter-spacing: 2px;
        }

        .name-bottom {
            font-size: 2.8rem;
            line-height: 1.1;
        }

        .name-top.writing, .name-and.writing, .name-bottom.writing {
            clip-path: inset(0 0% 0 0);
        }

        .name-top.hide, .name-and.hide, .name-bottom.hide {
            opacity: 0;
            transform: scale(0.9);
            filter: blur(8px);
            transition: all 0.8s ease;
        }

        /* الشاشة الأخيرة (الأزرار والعداد) */
        .action-group {
            position: absolute;
            bottom: calc(96px + env(safe-area-inset-bottom, 0px));
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .location-btn, .calendar-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #332211;
            text-decoration: none;
            font-family: 'Cinzel', serif;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(247, 244, 239, 0.8);
            border: 1px solid rgba(51, 34, 17, 0.3);
            backdrop-filter: blur(2px);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .location-btn svg, .calendar-btn svg {
            width: 14px;
            height: 14px;
            fill: #332211;
        }

        .countdown-box {
            position: absolute;
            bottom: calc(48px + env(safe-area-inset-bottom, 0px));
            z-index: 2;
            background: transparent;
            border-radius: 10px;
            padding: 4px 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 210px;
        }

        .time-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 38px;
        }

        .time-unit .number {
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            font-weight: 700;
            color: #3b2a22;
            line-height: 1;
        }

        .time-unit .label {
            font-family: 'Cinzel', serif;
            font-size: 0.48rem;
            font-weight: 600;
            color: #554433;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        .colon {
            font-size: 0.9rem;
            font-weight: bold;
            color: #3b2a22;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

    <!-- الصفحة الأولى البيضاء لتخصيص الدعوة بسهولة -->
    <div id="generator-screen">
        <div class="w-full max-w-md p-6 bg-white rounded-2xl shadow-xl border border-gray-100">
            <h1 class="text-xl font-bold text-center mb-6 text-gray-900">تخصيص بيانات الدعوة</h1>
            
            <form id="invite-form" class="space-y-4">
                <div>
                    <label class="block text-sm mb-1 font-semibold text-gray-700">اسم العريس (بالإنجليزية):</label>
                    <input type="text" id="groom_name_input" value="Niger Hasooni" required class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-black">
                </div>
                
                <div>
                    <label class="block text-sm mb-1 font-semibold text-gray-700">اسم العروس (بالإنجليزية):</label>
                    <input type="text" id="bride_name_input" value="Niggin Midi" required class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-black">
                </div>
                
                <div>
                    <label class="block text-sm mb-1 font-semibold text-gray-700">تاريخ ووقت الزواج (سهل الاختيار):</label>
                    <input type="datetime-local" id="wedding_date_input" value="2026-09-25T05:00" required class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-black">
                </div>

                <div>
                    <label class="block text-sm mb-1 font-semibold text-gray-700">اسم الموقع أو المدينة:</label>
                    <input type="text" id="location_name_input" value="Makkah" required class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-black">
                </div>

                <div>
                    <label class="block text-sm mb-1 font-semibold text-gray-700">رابط موقع الخريطة (Google Maps):</label>
                    <input type="url" id="location_url_input" value="https://maps.app.goo.gl/6wWBru4JgbSsMHRZ7?g_st=ic" required class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:border-black">
                </div>

                <button type="submit" class="w-full bg-black text-white font-bold py-3 rounded-lg hover:bg-gray-800 transition duration-200 mt-4">
                    اصنع الدعوة
                </button>
            </form>
        </div>
    </div>

    <!-- 1. شاشة الفيديو الأولى -->
    <div id="video-page" class="screen-page active">
        <img id="bg-image" src="IMG_0048.jpeg" alt="Background">
        <button id="playBtn">press</button>
        <video id="myVideo" src="2026-09-21 17:15:00.mov" playsinline webkit-playsinline preload="auto"></video>
    </div>

    <!-- 2. شاشة الأسماء (IMG_0042.jpeg) -->
    <div id="names-page" class="screen-page">
        <img src="IMG_0042.jpeg" alt="Background">
        <div id="couple-names">
            <div class="name-top" id="n1">Niggin Midi</div>
            <div class="name-and" id="n2">and</div>
            <div class="name-bottom" id="n3">Niger Hasooni</div>
        </div>
    </div>

    <!-- 3. الشاشة الأخيرة -->
    <div id="final-page" class="screen-page">
        <img src="https://files.catbox.moe/3e9448.jpeg" alt="Final Image">

        <div class="action-group">
            <a id="final-map-btn" href="https://maps.app.goo.gl/6wWBru4JgbSsMHRZ7?g_st=ic" target="_blank" class="location-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                </svg>
                LOCATION
            </a>

            <button class="calendar-btn" onclick="addToCalendar()">
                <svg viewBox="0 0 24 24">
                    <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zm-7 5h5v5h-5z"/>
                </svg>
                ADD TO CALENDAR
            </button>
        </div>

        <div class="countdown-box">
            <div class="time-unit">
                <span class="number" id="days">00</span>
                <span class="label">DAYS</span>
            </div>
            <span class="colon">:</span>
            <div class="time-unit">
                <span class="number" id="hours">00</span>
                <span class="label">HRS</span>
            </div>
            <span class="colon">:</span>
            <div class="time-unit">
                <span class="number" id="minutes">00</span>
                <span class="label">MIN</span>
            </div>
            <span class="colon">:</span>
            <div class="time-unit">
                <span class="number" id="seconds">00</span>
                <span class="label">SEC</span>
            </div>
        </div>
    </div>

    <!-- الصوت الخارجي -->
    <audio id="myAudio" src="%D9%86%D8%B4%D9%8A%D8%AF%20%D8%B2%D9%88%D8%A7%D8%AC.mp3" preload="auto"></audio>

    <script>
        let eventDate = new Date("2026-09-25T05:00:00").getTime();
        let locationNameText = "Makkah";

        // التعامل مع نموذج الإدخال وتحديث البيانات في كودك الأصلي
        document.getElementById('invite-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const groomVal = document.getElementById('groom_name_input').value;
            const brideVal = document.getElementById('bride_name_input').value;
            const dateVal = document.getElementById('wedding_date_input').value;
            const locNameVal = document.getElementById('location_name_input').value;
            const locUrlVal = document.getElementById('location_url_input').value;

            // تحديث الأسماء في الشاشة الثانية
            document.getElementById('n1').innerText = brideVal;
            document.getElementById('n3').innerText = groomVal;

            // تحديث رابط الخريطة واسم الموقع
            document.getElementById('final-map-btn').href = locUrlVal;
            locationNameText = locNameVal;

            // تحديث وقت العداد التنازلي
            if (dateVal) {
                eventDate = new Date(dateVal).getTime();
            }

            // إخفاء الصفحة البيضاء تماماً والانتقال لكودك الأصلي
            document.getElementById('generator-screen').classList.add('hidden');
        });

        // ظهور زر "press" بفيد خفيف بعد ثانية واحدة من فتح الصفحة
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('playBtn').classList.add('fade-in');
            }, 1000);
        });

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = eventDate - now;

            if (difference > 0) {
                const d = Math.floor(difference / (1000 * 60 * 60 * 24));
                const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((difference % (1000 * 60)) / 1000);

                document.getElementById("days").innerText = d < 10 ? "0" + d : d;
                document.getElementById("hours").innerText = h < 10 ? "0" + h : h;
                document.getElementById("minutes").innerText = m < 10 ? "0" + m : m;
                document.getElementById("seconds").innerText = s < 10 ? "0" + s : s;
            }
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        function addToCalendar() {
            const title = "Wedding Celebration";
            const description = "We are honored to have you join our special day!";
            
            // تحويل التاريخ لـ ICS format
            const dObj = new Date(eventDate);
            const startTime = dObj.toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
            const endDateObj = new Date(eventDate + 3 * 3600 * 1000); // إضافة 3 ساعات افتراضياً
            const endTime = endDateObj.toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";

            const icsLines = [
                "BEGIN:VCALENDAR",
                "VERSION:2.0",
                "PRODID:-//Wedding Invitation//EN",
                "BEGIN:VEVENT",
                "UID:" + Date.now() + "@wedding.invitation",
                "DTSTAMP:" + new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z",
                "DTSTART:" + startTime,
                "DTEND:" + endTime,
                "SUMMARY:" + title,
                "DESCRIPTION:" + description,
                "LOCATION:" + locationNameText,
                "END:VEVENT",
                "END:VCALENDAR"
            ];

            const icsBlob = new Blob([icsLines.join("\r\n")], { type: "text/calendar;charset=utf-8" });
            const downloadUrl = URL.createObjectURL(icsBlob);
            
            const anchor = document.createElement("a");
            anchor.href = downloadUrl;
            anchor.setAttribute("download", "wedding-invitation.ics");
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
            URL.revokeObjectURL(downloadUrl);
        }

        const video = document.getElementById('myVideo');
        const audio = document.getElementById('myAudio');
        const playBtn = document.getElementById('playBtn');
        const videoPage = document.getElementById('video-page');
        const namesPage = document.getElementById('names-page');
        const finalPage = document.getElementById('final-page');

        playBtn.addEventListener('click', () => {
            playBtn.style.opacity = '0';
            setTimeout(() => playBtn.style.display = 'none', 300);

            video.currentTime = 5;
            video.style.opacity = '1';

            video.play().catch(error => {
                console.log("خطأ في تشغيل الفيديو:", error);
                playBtn.style.display = 'flex';
                playBtn.style.opacity = '1';
            });
        });

        video.addEventListener('ended', () => {
            audio.play().catch(error => {
                console.log("خطأ في تشغيل الصوت:", error);
            });

            namesPage.classList.add('active');
            setTimeout(() => {
                videoPage.classList.remove('active');
            }, 600);

            setTimeout(() => document.getElementById('n1').classList.add('writing'), 400);
            setTimeout(() => document.getElementById('n2').classList.add('writing'), 2200);
            setTimeout(() => document.getElementById('n3').classList.add('writing'), 3200);

            setTimeout(() => {
                document.getElementById('n1').classList.add('hide');
                document.getElementById('n2').classList.add('hide');
                document.getElementById('n3').classList.add('hide');
            }, 6500);

            setTimeout(() => {
                finalPage.classList.add('active');
                setTimeout(() => {
                    namesPage.classList.remove('active');
                }, 600);
            }, 7500);
        });
    </script>
</body>
</html>
