<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُولّد دعوة الزواج الرقمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #fff; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- شاشة إدخال البيانات (المولد) -->
    <div id="generator-screen" class="w-full max-w-md bg-slate-800 p-6 rounded-2xl shadow-2xl border border-slate-700">
        <h1 class="text-2xl font-bold text-center mb-6 text-amber-400">💍 صانع دعوة الزواج الرقمية</h1>
        
        <form id="invite-form" class="space-y-4">
            <div>
                <label class="block text-sm mb-1 text-slate-300">اسم العريس:</label>
                <input type="text" id="groom_name" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-amber-400" placeholder="مثال: أحمد">
            </div>
            
            <div>
                <label class="block text-sm mb-1 text-slate-300">اسم العروس:</label>
                <input type="text" id="bride_name" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-amber-400" placeholder="مثال: فاطمة">
            </div>
            
            <div>
                <label class="block text-sm mb-1 text-slate-300">تاريخ وقاعة الزواج:</label>
                <input type="text" id="wedding_date" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-amber-400" placeholder="مثال: الخميس 15 شوال 1447 هـ">
            </div>

            <div>
                <label class="block text-sm mb-1 text-slate-300">اسم القاعة / الموقع:</label>
                <input type="text" id="location_name" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-amber-400" placeholder="مثال: قاعة الملك ليلة للاحتفالات">
            </div>

            <div>
                <label class="block text-sm mb-1 text-slate-300">رابط موقع القاعة (Google Maps):</label>
                <input type="url" id="location_url" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-amber-400" placeholder="https://maps.app.goo.gl/...">
            </div>

            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-lg transition duration-200 mt-4 shadow-lg">
                ✨ اصنع الدعوة الآن
            </button>
        </form>
    </div>

    <!-- شاشة عرض الدعوة التفاعلية (تظهر بعد التوليد) -->
    <div id="invitation-screen" class="hidden w-full max-w-md bg-slate-900 min-h-screen relative shadow-2xl overflow-hidden flex flex-col items-center justify-between p-6 text-center">
        <!-- محتوى الدعوة سيتم حقنه هنا بروابط الوسائط الخاصة بك -->
        <div class="w-full space-y-6 my-auto">
            <h2 id="view-title" class="text-3xl font-black text-amber-400">حفل زفاف مبارك</h2>
            <p class="text-lg text-slate-200">يسعدنا حضوركم ليلة زفاف</p>
            <div class="text-2xl font-bold text-white bg-slate-800 p-4 rounded-xl border border-amber-500/30">
                <span id="view-groom"></span> & <span id="view-bride"></span>
            </div>
            
            <!-- فيديو الدعوة -->
            <div class="rounded-xl overflow-hidden shadow-lg border border-slate-700">
                <video id="view-video" controls class="w-full" poster="https://raw.githubusercontent.com/alhasanyk/V0-customized-interactive-invitation-files/refs/heads/main/IMG_0048.jpeg">
                    <source src="https://raw.githubusercontent.com/alhasanyk/V0-customized-interactive-invitation-files/refs/heads/main/2026-09-21%2017%3A15%3A00.mov" type="video/quicktime">
                    متصفحك لا يدعم عرض الفيديو
                </video>
            </div>

            <p id="view-date" class="text-amber-200 font-semibold"></p>
            <p id="view-location" class="text-slate-300"></p>

            <a id="view-map-btn" href="#" target="_blank" class="inline-block bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-lg font-bold transition">
                📍 فتح موقع القاعة على الخريطة
            </a>
        </div>

        <button onclick="location.reload()" class="text-xs text-slate-500 underline mt-4">إنشاء دعوة جديدة</button>
    </div>

    <script>
        const repoBase = "https://raw.githubusercontent.com/alhasanyk/V0-customized-interactive-invitation-files/refs/heads/main/";

        document.getElementById('invite-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // جلب المدخلات
            const groom = document.getElementById('groom_name').value;
            const bride = document.getElementById('bride_name').value;
            const date = document.getElementById('wedding_date').value;
            const locName = document.getElementById('location_name').value;
            const locUrl = document.getElementById('location_url').value;

            // تعبئة البيانات في شاشة العرض
            document.getElementById('view-groom').innerText = groom;
            document.getElementById('view-bride').innerText = bride;
            document.getElementById('view-date').innerText = "📅 التاريخ: " + date;
            document.getElementById('view-location').innerText = "📍 القاعة: " + locName;
            document.getElementById('view-map-btn').href = locUrl;

            // إخفاء نموذج التوليد وإظهار الدعوة
            document.getElementById('generator-screen').classList.add('hidden');
            document.getElementById('invitation-screen').classList.remove('hidden');
        });
    </script>
</body>
</html>
