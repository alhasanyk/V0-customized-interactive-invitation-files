<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Wedding Invitation</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Cinzel:wght@400;500;600&display=swap"
      rel="stylesheet">


<style>

/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #f5f1ec;
    color: #4b382c;
    font-family: Arial, sans-serif;
}


/* =========================
   FORM
========================= */

.form-container {
    width: min(700px, calc(100% - 24px));
    margin: 30px auto;

    padding: 28px;

    background: rgba(255,255,255,.97);

    border-radius: 18px;

    box-shadow:
        0 15px 50px rgba(0,0,0,.12);
}

.form-title {
    text-align: center;
    margin-bottom: 25px;
}

.form-title h1 {
    margin: 0 0 8px;

    font-family: Cinzel, serif;

    font-size: 25px;
    font-weight: 500;
}

.form-title p {
    margin: 0;

    color: #8a7568;

    font-size: 14px;
}

.form-grid {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 16px;
}

.field {
    display: flex;
    flex-direction: column;

    gap: 7px;
}

.field.full {
    grid-column: 1 / -1;
}

.field label {
    font-size: 13px;

    color: #604b3d;
}

.field input {
    width: 100%;
    height: 48px;

    padding: 0 13px;

    border: 1px solid #ddd3cb;
    border-radius: 9px;

    background: white;

    font-size: 15px;

    outline: none;
}

.field input:focus {
    border-color: #8c6c56;

    box-shadow:
        0 0 0 3px rgba(140,108,86,.10);
}


/* =========================
   CREATE BUTTON
========================= */

.create-button {
    display: block;

    width: 100%;
    height: 52px;

    margin-top: 22px;

    border: 0;
    border-radius: 9px;

    background: #513a2c;

    color: white;

    font-size: 16px;

    cursor: pointer;

    -webkit-appearance: none;
    appearance: none;
}

.create-button:active {
    transform: scale(.99);
}


/* =========================
   INVITATION
========================= */

.invitation {
    display: none;

    width: 100%;
}

.invitation.show {
    display: block;
}


/*
   IMPORTANT

   Original image ratio:
   768 × 1365

   The card always maintains
   exactly the same ratio.
*/

.card {
    position: relative;

    width: 100%;

    aspect-ratio: 768 / 1365;

    overflow: hidden;

    background: #eee;
}


/* =========================
   IMAGE
========================= */

.card-image {
    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    display: block;

    /*
       IMPORTANT:
       NO CROPPING
    */

    object-fit: fill;

    user-select: none;

    -webkit-user-drag: none;
}


/* =========================
   OVERLAY
========================= */

.overlay {
    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;
}


/* =========================
   GENERAL ELEMENT
========================= */

.element {
    position: absolute;

    transform: translate(-50%, -50%);

    text-align: center;

    white-space: nowrap;

    color: #4c382c;
}


/* =========================
   BRIDE
========================= */

.bride-name {

    left: 50%;

    top: 45.64%;

    font-family: Parisienne, cursive;

    font-size: clamp(
        34px,
        6vw,
        62px
    );

    line-height: 1;
}


/* =========================
   AND
========================= */

.and {

    left: 50%;

    top: 41.76%;

    font-family: Parisienne, cursive;

    font-size: clamp(
        20px,
        3.5vw,
        35px
    );

    color: #987b67;
}


/* =========================
   GROOM
========================= */

.groom-name {

    left: 50%;

    top: 37.73%;

    font-family: Parisienne, cursive;

    font-size: clamp(
        34px,
        6vw,
        62px
    );

    line-height: 1;
}


/* =========================
   WEEKDAY
========================= */

.weekday {

    left: 31%;

    top: 59.93%;

    font-family: Georgia, serif;

    font-size: clamp(
        13px,
        2.2vw,
        23px
    );

}


/* =========================
   DAY
========================= */

.day-number {

    left: 50%;

    top: 59.12%;

    font-family: Georgia, serif;

    font-size: clamp(
        32px,
        5vw,
        53px
    );

    font-weight: 500;
}


/* =========================
   MONTH
========================= */

.month {

    left: 50%;

    top: 62.05%;

    font-family: Georgia, serif;

    font-size: clamp(
        14px,
        2.3vw,
        24px
    );

    letter-spacing: 1px;
}


/* =========================
   YEAR
========================= */

.year {

    left: 50%;

    top: 64.25%;

    font-family: Georgia, serif;

    font-size: clamp(
        12px,
        2vw,
        20px
    );
}


/* =========================
   TIME
========================= */

.time {

    left: 69%;

    top: 59.93%;

    font-family: Georgia, serif;

    font-size: clamp(
        13px,
        2.1vw,
        22px
    );
}


/* =========================
   LOCATION ICON
========================= */

.location-icon {

    left: 50%;

    top: 65.86%;

    font-size: clamp(
        18px,
        3vw,
        30px
    );

    color: #856650;
}


/* =========================
   LOCATION
========================= */

.location-name {

    left: 50%;

    top: 70.55%;

    font-family: Parisienne, cursive;

    font-size: clamp(
        35px,
        6vw,
        65px
    );

    line-height: 1;

    color: #4b3529;

    text-decoration: none;
}


/* =========================
   LOCATION SUBTITLE
========================= */

.location-subtitle {

    left: 50%;

    top: 73.35%;

    font-family: Georgia, serif;

    font-size: clamp(
        14px,
        2.5vw,
        25px
    );
}


/* =========================
   EDIT
========================= */

.edit-wrapper {

    padding: 18px 20px 25px;

    background: #f5f1ec;

    text-align: center;
}

.edit-button {

    width: min(300px, 90%);

    height: 48px;

    border: none;

    border-radius: 9px;

    background: #513a2c;

    color: white;

    font-size: 14px;

    cursor: pointer;
}


/* =========================
   MOBILE FORM
========================= */

@media (max-width: 600px) {

    .form-container {

        width: calc(100% - 20px);

        margin: 10px auto;

        padding: 20px 16px;
    }

    .form-grid {

        grid-template-columns: 1fr;
    }

    .field.full {

        grid-column: auto;
    }

    .form-title h1 {

        font-size: 21px;
    }
}

</style>

</head>


<body>


<!-- ==================================================
     FORM
================================================== -->

<div
    id="formContainer"
    class="form-container"
>

    <div class="form-title">

        <h1>
            إنشاء بطاقة دعوة زواج
        </h1>

        <p>
            أدخل البيانات الخاصة بالدعوة
        </p>

    </div>


    <div class="form-grid">


        <!-- BRIDE -->

        <div class="field">

            <label>
                اسم العروس
            </label>

            <input
                id="brideInput"
                type="text"
                placeholder="Niggin Midi"
            >

        </div>


        <!-- GROOM -->

        <div class="field">

            <label>
                اسم العريس
            </label>

            <input
                id="groomInput"
                type="text"
                placeholder="Niger Hasooni"
            >

        </div>


        <!-- DATE -->

        <div class="field">

            <label>
                التاريخ
            </label>

            <input
                id="dateInput"
                type="date"
            >

        </div>


        <!-- TIME -->

        <div class="field">

            <label>
                الوقت
            </label>

            <input
                id="timeInput"
                type="time"
                value="05:00"
            >

        </div>


        <!-- LOCATION -->

        <div class="field full">

            <label>
                الموقع
            </label>

            <input
                id="locationInput"
                type="text"
                placeholder="Makkah"
            >

        </div>


        <!-- GOOGLE MAPS -->

        <div class="field full">

            <label>
                رابط خرائط Google
            </label>

            <input
                id="mapsInput"
                type="url"
                placeholder="https://maps.google.com/..."
            >

        </div>

    </div>


    <!--
       IMPORTANT:
       onclick is directly attached.
       This avoids event-listener problems.
    -->

    <button
        type="button"
        class="create-button"
        onclick="createInvitation()"
    >
        إنشاء البطاقة
    </button>

</div>



<!-- ==================================================
     INVITATION
================================================== -->

<div
    id="invitation"
    class="invitation"
>


    <div class="card">


        <!-- IMAGE -->

        <img
            class="card-image"
            src="https://files.catbox.moe/hkkl4a.png"
            alt="Wedding Invitation"
        >


        <!-- OVERLAY -->

        <div class="overlay">


            <!-- GROOM -->

            <div
                id="groomOutput"
                class="element groom-name"
            ></div>


            <!-- AND -->

            <div
                class="element and"
            >
                and
            </div>


            <!-- BRIDE -->

            <div
                id="brideOutput"
                class="element bride-name"
            ></div>


            <!-- WEEKDAY -->

            <div
                id="weekdayOutput"
                class="element weekday"
            ></div>


            <!-- DAY -->

            <div
                id="dayOutput"
                class="element day-number"
            ></div>


            <!-- MONTH -->

            <div
                id="monthOutput"
                class="element month"
            ></div>


            <!-- YEAR -->

            <div
                id="yearOutput"
                class="element year"
            ></div>


            <!-- TIME -->

            <div
                id="timeOutput"
                class="element time"
            ></div>


            <!-- LOCATION ICON -->

            <div
                class="element location-icon"
            >
                ♥
            </div>


            <!-- LOCATION -->

            <a
                id="locationOutput"
                class="element location-name"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            ></a>


            <!-- SUBTITLE -->

            <div
                class="element location-subtitle"
            >
                City of Grace and Devotion
            </div>


        </div>

    </div>


    <!-- EDIT -->

    <div class="edit-wrapper">

        <button
            type="button"
            class="edit-button"
            onclick="editInvitation()"
        >
            تعديل البيانات
        </button>

    </div>

</div>



<script>

/* ==================================================
   CREATE INVITATION
================================================== */

function createInvitation() {

    /* Get values */

    var bride =
        document.getElementById("brideInput").value.trim();

    var groom =
        document.getElementById("groomInput").value.trim();

    var date =
        document.getElementById("dateInput").value;

    var time =
        document.getElementById("timeInput").value;

    var location =
        document.getElementById("locationInput").value.trim();

    var maps =
        document.getElementById("mapsInput").value.trim();


    /* Names */

    if (bride === "") {

        alert("يرجى إدخال اسم العروس");

        return;
    }


    if (groom === "") {

        alert("يرجى إدخال اسم العريس");

        return;
    }


    if (date === "") {

        alert("يرجى اختيار التاريخ");

        return;
    }


    if (location === "") {

        alert("يرجى إدخال الموقع");

        return;
    }


    /* ==============================================
       PUT NAMES ON CARD
    ============================================== */

    document.getElementById(
        "brideOutput"
    ).textContent = bride;


    document.getElementById(
        "groomOutput"
    ).textContent = groom;


    /* ==============================================
       DATE
    ============================================== */

    var d =
        new Date(date + "T12:00:00");


    var days = [
        "SUNDAY",
        "MONDAY",
        "TUESDAY",
        "WEDNESDAY",
        "THURSDAY",
        "FRIDAY",
        "SATURDAY"
    ];


    var months = [
        "JAN",
        "FEB",
        "MAR",
        "APR",
        "MAY",
        "JUN",
        "JUL",
        "AUG",
        "SEP",
        "OCT",
        "NOV",
        "DEC"
    ];


    document.getElementById(
        "weekdayOutput"
    ).textContent =
        days[d.getDay()];


    document.getElementById(
        "dayOutput"
    ).textContent =
        d.getDate();


    document.getElementById(
        "monthOutput"
    ).textContent =
        months[d.getMonth()];


    document.getElementById(
        "yearOutput"
    ).textContent =
        d.getFullYear();


    /* ==============================================
       TIME
    ============================================== */

    var formattedTime = "";

    if (time !== "") {

        var parts = time.split(":");

        var hour =
            parseInt(parts[0], 10);

        var minute =
            parts[1];

        var ampm =
            hour >= 12 ? "PM" : "AM";

        hour =
            hour % 12;

        if (hour === 0) {
            hour = 12;
        }

        formattedTime =
            String(hour).padStart(2, "0")
            + ":"
            + minute
            + " "
            + ampm;
    }


    document.getElementById(
        "timeOutput"
    ).textContent =
        formattedTime;


    /* ==============================================
       LOCATION
    ============================================== */

    var locationElement =
        document.getElementById(
            "locationOutput"
        );


    locationElement.textContent =
        location;


    /* ==============================================
       GOOGLE MAPS
    ============================================== */

    if (maps !== "") {

        locationElement.href = maps;

    } else {

        locationElement.href =
            "https://www.google.com/maps/search/?api=1&query="
            +
            encodeURIComponent(location);
    }


    /* ==============================================
       SHOW INVITATION
    ============================================== */

    document.getElementById(
        "formContainer"
    ).style.display = "none";


    document.getElementById(
        "invitation"
    ).classList.add("show");


    /* Go to top */

    window.scrollTo(0, 0);
}


/* ==================================================
   EDIT INVITATION
================================================== */

function editInvitation() {

    document.getElementById(
        "invitation"
    ).classList.remove("show");


    document.getElementById(
        "formContainer"
    ).style.display = "block";


    window.scrollTo(0, 0);
}

</script>


</body>
</html>
